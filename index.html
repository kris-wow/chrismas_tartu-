<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tartu Virtual Life</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 10px;
            z-index: 1;
        }
    </style>
</head>

<body>

<div id="info">
    <h2>Tartu Virtual Life</h2>
    <p>Use W, A, S, D to move</p>
    <p>Explore the city!</p>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(10, 20, 10);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// Ground
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x55aa55 })
);

ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Road
const road = new THREE.Mesh(
    new THREE.BoxGeometry(12, 0.1, 200),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
);

road.position.y = 0.05;
scene.add(road);

// Buildings
function createBuilding(x, z, color) {
    const building = new THREE.Mesh(
        new THREE.BoxGeometry(10, 12, 10),
        new THREE.MeshStandardMaterial({ color })
    );

    building.position.set(x, 6, z);
    scene.add(building);
}

createBuilding(-18, -15, 0xffcc99);
createBuilding(18, -15, 0xff9999);
createBuilding(-18, 15, 0xffffff);
createBuilding(18, 15, 0xffdd66);

// Player
const player = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x3366ff })
);

player.position.set(0, 1.2, 0);
scene.add(player);

camera.position.set(0, 7, 12);
camera.lookAt(player.position);

// Movement
const keys = {};

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function animate() {
    requestAnimationFrame(animate);

    if (keys['w']) player.position.z -= 0.15;
    if (keys['s']) player.position.z += 0.15;
    if (keys['a']) player.position.x -= 0.15;
    if (keys['d']) player.position.x += 0.15;

    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 12;
    camera.position.y = 7;
    camera.lookAt(player.position);

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
